<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Careers</title>
<style>
:root{--li-blue:#0A66C2;--li-blue-hover:#004182;--li-green:#01754F;--li-green-brand:#0F9F6F;--li-bg:#F4F2EE;--li-card:#FFFFFF;--li-border:#E4E4E4;--li-text:rgba(0,0,0,.9);--li-text-2:rgba(0,0,0,.6);--li-text-3:rgba(0,0,0,.45);--li-green-bg:#D6FAEE;--li-blue-bg:#E8F3FF;--li-font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--li-radius:8px;--li-ring:0 0 0 1px rgb(140 140 140/.2);--li-shadow:0 0 1px 0 rgb(140 140 140/.2),0 4px 12px 0 rgb(0 0 0/.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--li-bg);color:var(--li-text);font-family:var(--li-font);font-size:14px}
.topbar{background:var(--li-card);border-bottom:1px solid var(--li-border);height:52px;display:flex;align-items:center;padding:0 24px;gap:8px}
.logo{background:var(--li-blue);color:#fff;font-weight:700;border-radius:6px;padding:4px 8px;font-size:18px}
.topbar .title{font-weight:600;font-size:16px}
.wrap{max-width:1128px;margin:24px auto;padding:0 16px}
.header{margin-bottom:20px}
.header h1{font-size:24px;font-weight:600;margin-bottom:4px}
.header p{color:var(--li-text-2);font-size:14px}
/* User picker */
.user-picker{margin-bottom:20px;display:flex;align-items:center;gap:12px}
.user-picker label{font-weight:600;font-size:14px}
.user-picker select{padding:8px 12px;border-radius:var(--li-radius);border:1px solid var(--li-border);font-size:14px}
/* Search */
.search-wrap{position:relative;margin-bottom:24px}
.search-wrap input{width:100%;padding:12px 16px 12px 40px;border:1px solid var(--li-border);border-radius:var(--li-radius);font-size:15px;background:var(--li-card);box-shadow:var(--li-ring)}
.search-wrap input:focus{outline:none;border-color:var(--li-blue);box-shadow:0 0 0 1px var(--li-blue)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--li-text-3)}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--li-card);border-radius:var(--li-radius);box-shadow:var(--li-ring);padding:20px;cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card:hover{box-shadow:var(--li-shadow);border-color:var(--li-blue);transform:translateY(-2px)}
.card-title{font-size:15px;font-weight:600;margin-bottom:4px}
.card-category{font-size:12px;color:var(--li-text-2)}
.card-companies{font-size:11px;color:var(--li-text-3);margin-top:6px}
.fit-badge{flex-shrink:0;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.fit-high{background:var(--li-green-bg);color:var(--li-green)}
.fit-med{background:var(--li-blue-bg);color:var(--li-blue)}
.fit-low{background:#fef3c7;color:#92400e}
.no-results{text-align:center;padding:40px;color:var(--li-text-3);font-size:15px}
</style>
</head>
<body>
<div class="topbar"><span class="logo">in</span><span class="title">Career Explore</span></div>
<div class="wrap">
  <div class="header">
    <h1>Discover where you could go</h1>
    <p>Search roles and see how your skills match — click any card to dive deeper.</p>
  </div>
  <div class="user-picker">
    <label>Viewing as:</label>
    <select id="userSelect" onchange="changeUser()"></select>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1a5.5 5.5 0 014.38 8.82l3.65 3.66a.75.75 0 01-1.06 1.06l-3.66-3.65A5.5 5.5 0 116.5 1zm0 1.5a4 4 0 100 8 4 4 0 000-8z"/></svg>
    <input type="text" id="searchInput" placeholder="Search careers..." oninput="render()">
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════
// DATA — replace these with API calls when backend is ready
// ═══════════════════════════════════════════════════════════════
const ROLES = [
  {id:"software_engineer",name:"Software Engineer",category:"Technology",skills:["Python","AWS","DevOps","Software","Engineering","Data Analysis"],companies:["AI Dynamics","FutureWorks","Innovatech"]},
  {id:"devops_engineer",name:"DevOps Engineer",category:"Technology",skills:["AWS","DevOps","Blockchain","Network Security","Python","Information Security"],companies:["AI Dynamics","FutureWorks"]},
  {id:"data_scientist",name:"Data Scientist",category:"Technology",skills:["Python","Machine Learning","Data Analysis","AWS","Economics","Investing"],companies:["AI Dynamics","Innovatech"]},
  {id:"ux_designer",name:"UX Designer",category:"Design",skills:["UX/UI","Graphic Design","Photoshop","Communication","Content Creation","Creative Writing"],companies:["FutureWorks","Innovatech"]},
  {id:"product_manager",name:"Product Manager",category:"Business",skills:["Agile","Scrum","Project Planning","Strategic Planning","Communication","Data Analysis"],companies:["AI Dynamics","Innovatech"]},
  {id:"financial_analyst",name:"Financial Analyst",category:"Finance",skills:["Financial Modeling","Corporate Finance","Investing","Economics","Excel","Accounting"],companies:["AI Dynamics","Global Solutions"]},
  {id:"marketing_specialist",name:"Marketing Specialist",category:"Business",skills:["Marketing Strategies","SEO","Content Creation","Communication","Strategic Planning","Marketing"],companies:["FutureWorks","Innovatech"]},
  {id:"hr_coordinator",name:"HR Coordinator",category:"Business",skills:["Recruiting","HR Policies","Employee Relations","Communication","Negotiation","Administration"],companies:["Global Solutions"]},
  {id:"sales_representative",name:"Sales Representative",category:"Business",skills:["Negotiation","Communication","Public Speaking","Strategic Planning","Business","Marketing"],companies:["AI Dynamics","Innovatech"]},
  {id:"customer_service_manager",name:"Customer Service Manager",category:"Business",skills:["Communication","Employee Relations","Negotiation","Project Planning","Administration","Business"],companies:["Global Solutions","Innovatech"]}
];

const USERS = [
  {id:"user_5329",name:"Alex Rivera",degree:"Economics",skills:["Corporate Finance","Economics","Ethical Hacking","Financial Modeling","Information Security","Investing","Network Security"],hero:true},
  {id:"user_5377",name:"Sam Carter",degree:"Software Engineering",skills:["AWS","Blockchain","Computer","DevOps","Engineering","Science","Software"]},
  {id:"user_8705",name:"Jordan Lee",degree:"Information Technology",skills:["AWS","Blockchain","Computer","Corporate Finance","DevOps","Financial Modeling","Information","Investing","Science","Technology"]},
  {id:"user_4579",name:"Maya Brooks",degree:"Psychology",skills:["Education","Psychology"]},
  {id:"user_9138",name:"Chris Diaz",degree:"Accounting",skills:["Accounting","Corporate Finance","Ethical Hacking","Financial Modeling","Information Security","Investing","Network Security"]}
];

// ═══════════════════════════════════════════════════════════════
// FIT MATH — mirrors backend/fit.py
// ═══════════════════════════════════════════════════════════════
function computeFit(userSkills, roleSkills) {
  const us = new Set(userSkills.map(s => s.toLowerCase()));
  const matched = roleSkills.filter(s => us.has(s.toLowerCase())).length;
  return roleSkills.length ? Math.round((matched / roleSkills.length) * 100) : 0;
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let currentUserId = (USERS.find(u => u.hero) || USERS[0]).id;

function currentUser() { return USERS.find(u => u.id === currentUserId) || USERS[0]; }

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function initUserPicker() {
  const sel = document.getElementById('userSelect');
  sel.innerHTML = USERS.map(u => `<option value="${u.id}"${u.id===currentUserId?' selected':''}>${u.name} — ${u.degree}${u.hero?' ⭐':''}</option>`).join('');
}

function changeUser() {
  currentUserId = document.getElementById('userSelect').value;
  render();
}

function render() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const user = currentUser();
  const grid = document.getElementById('grid');

  const filtered = ROLES.filter(r =>
    r.name.toLowerCase().includes(query) ||
    r.category.toLowerCase().includes(query) ||
    r.skills.some(s => s.toLowerCase().includes(query))
  );

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results">No careers match your search</div>';
    return;
  }

  grid.innerHTML = filtered.map(role => {
    const fit = computeFit(user.skills, role.skills);
    const cls = fit >= 50 ? 'fit-high' : fit >= 25 ? 'fit-med' : 'fit-low';
    return `<div class="card" onclick="goToComparison('${role.id}')">
      <div>
        <div class="card-title">${role.name}</div>
        <div class="card-category">${role.category}</div>
        <div class="card-companies">${role.companies.join(' · ')}</div>
      </div>
      <div class="fit-badge ${cls}">${fit}%</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION — click card → comparison page
// ═══════════════════════════════════════════════════════════════
function goToComparison(roleId) {
  // When integrated: window.location.href = `/comparison?role=${roleId}&user=${currentUserId}`;
  // For demo, go to demo.html (comparison page):
  window.location.href = `demo.html?role=${roleId}&user=${currentUserId}`;
}

// Init
initUserPicker();
render();
</script>
</body>
</html>
