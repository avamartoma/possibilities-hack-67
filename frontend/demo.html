<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Career Map — Comparison (static demo)</title>
<!--
  Zero-dependency static mirror of the Next.js Comparison Page, styled to look
  like LinkedIn. No Node, no backend, no network: data is embedded inline and
  the fit math mirrors backend/fit.py::compute_fit and frontend/lib/fit.ts.
  Open by double-clicking this file in any browser.

  Keep DATA + styling in sync with:
    backend/data/{users,roleSkills}.json
    frontend/lib/theme.ts, components/LinkedInNav.tsx,
    components/ComparisonPanel/*, app/page.tsx
-->
<style>
  :root {
    --blue: #0a66c2; --blue-hover: #004182; --blue-light: #edf3f8;
    --page-bg: #f4f2ee; --card-bg: #fff; --card-border: rgba(0,0,0,0.08);
    --text-primary: rgba(0,0,0,0.9); --text-secondary: rgba(0,0,0,0.6); --text-hint: rgba(0,0,0,0.45);
    --green: #057642; --green-bg: #ddf5e6; --amber: #915907;
    --card-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 2px 3px rgba(0,0,0,0.06);
    --font: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); font-family: var(--font); color: var(--text-primary); }

  /* Top nav */
  .nav { position: sticky; top: 0; z-index: 100; background: var(--card-bg);
    border-bottom: 1px solid var(--card-border); box-shadow: 0 0 0 1px rgba(0,0,0,0.04); }
  .nav-inner { max-width: 1128px; margin: 0 auto; height: 52px; display: flex; align-items: center;
    gap: 8px; padding: 0 16px; }
  .logo { background: var(--blue); color: #fff; font-weight: 800; font-size: 22px; width: 34px;
    height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--blue-light);
    border-radius: 4px; padding: 0 8px; height: 34px; width: 280px; color: var(--text-secondary); font-size: 14px; }
  .nav-spacer { flex: 1; }
  .nav-icon { display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: 12px; min-width: 72px; cursor: pointer; gap: 2px; }
  .avatar-sm { width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

  /* Layout */
  main { max-width: 1128px; margin: 0 auto; padding: 24px 16px; display: grid;
    grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
  .rail { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card-bg); border-radius: 8px; box-shadow: var(--card-shadow); overflow: hidden; }

  .id-cover { height: 56px; background: linear-gradient(120deg, var(--blue), #378fe9); }
  .id-body { padding: 0 16px 16px; margin-top: -28px; text-align: center; }
  .avatar-lg { width: 56px; height: 56px; border-radius: 50%; background: var(--blue); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
    border: 2px solid var(--card-bg); }
  .id-body select { display: block; width: 100%; margin-top: 10px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--card-border); font-size: 14px; font-family: var(--font); }
  .tagline { margin: 8px 0 0; color: var(--text-secondary); font-size: 13px; font-style: italic; }
  .degree { margin: 4px 0 0; color: var(--text-hint); font-size: 12px; }

  .roles-card { padding: 16px; }
  .roles-card h3 { margin: 0 0 12px; font-size: 16px; }
  .role-btn { display: block; width: 100%; text-align: left; padding: 8px 12px; margin-bottom: 4px;
    border-radius: 6px; border: none; background: transparent; color: var(--text-primary);
    cursor: pointer; font-weight: 500; font-size: 14px; font-family: var(--font); }
  .role-btn.active { background: var(--blue-light); color: var(--blue); font-weight: 600; }

  /* Comparison panel */
  .panel-cover { height: 88px; background: linear-gradient(120deg, var(--blue), #378fe9); }
  .panel-body { padding: 0 24px 24px; }
  .role-icon { width: 72px; height: 72px; border-radius: 12px; background: var(--card-bg);
    border: 2px solid var(--card-bg); box-shadow: var(--card-shadow); display: flex; align-items: center;
    justify-content: center; font-size: 32px; margin-top: -24px; }
  .panel h2 { margin: 12px 0 4px; font-size: 24px; font-weight: 600; }
  .role-desc { margin: 0; color: var(--text-secondary); line-height: 1.5; font-size: 15px; }
  hr.div { border: none; border-top: 1px solid var(--card-border); margin: 20px 0; }
  .ring-row { display: flex; gap: 32px; align-items: center; margin-bottom: 0; flex-wrap: wrap; }
  .companies { flex: 1; min-width: 240px; }
  .companies h4 { margin: 0 0 10px; font-size: 16px; }
  .job-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
  .job-row:last-child { border-bottom: none; }
  .job-logo { width: 40px; height: 40px; border-radius: 6px; background: var(--blue-light); color: var(--blue);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .job-role { font-weight: 600; color: var(--blue); font-size: 15px; }
  .job-company { color: var(--text-secondary); font-size: 14px; }
  .job-meta { color: var(--text-hint); font-size: 12px; margin-top: 4px; }
  .job-easy { color: var(--blue); font-weight: 600; }
  .strong-applicant { display: inline-block; margin-top: 4px; background: var(--green-bg); color: var(--green);
    border-radius: 4px; padding: 1px 8px; font-size: 12px; font-weight: 600; }

  .skill-cols { display: flex; gap: 24px; width: 100%; }
  .skill-cols > div { flex: 1; }
  .skill-cols h4 { margin: 0 0 12px; font-size: 16px; }
  .skill-cols h4 .count { color: var(--text-secondary); }
  .skill-list { list-style: none; padding: 0; margin: 0; }
  .skill-item { display: flex; align-items: center; gap: 8px; border-radius: 16px; padding: 6px 12px;
    margin-bottom: 8px; font-weight: 600; font-size: 14px; }
  .skill-item .mark { font-weight: 700; }
  .skill-have { background: var(--green-bg); color: var(--green); border: 1px solid rgba(5,118,66,0.2); }
  .skill-missing { background: #f3f2ef; color: var(--text-primary); border: 1px solid var(--card-border); }
  .empty-have { color: var(--text-hint); font-size: 14px; }
  .empty-missing { color: var(--green); font-size: 14px; font-weight: 600; }
  .ring-label { margin-top: 6px; font-weight: 600; font-size: 14px; }
  .build-btn { margin-top: 24px; background: var(--blue); color: #fff; border: none; border-radius: 24px;
    padding: 10px 28px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  .build-btn:hover { background: var(--blue-hover); }
  #ring-arc { transition: stroke-dashoffset 1s ease-out; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f172a;
    color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    max-width: 520px; opacity: 0; transition: opacity .25s ease; pointer-events: none; white-space: pre-wrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<!-- Top nav -->
<header class="nav">
  <div class="nav-inner">
    <div class="logo">in</div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"/></svg>
      <span>Search</span>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M23 9v2h-2v7a3 3 0 01-3 3h-4v-6h-2v6H6a1 1 0 01-1-1v-9H3V9l9-7 5 3.9V3h3v4.5l3 1.5z"/></svg>Home</div>
    <div class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16v-1a5 5 0 00-10 0v1h10zM7 13a3 3 0 100-6 3 3 0 000 6zm14 3v-1a4 4 0 00-3-3.87A3 3 0 0014 7a4 4 0 00-1 .13 5 5 0 011 3 6 6 0 01.34 2H21z"/></svg>My Network</div>
    <div class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17 6V5a3 3 0 00-3-3h-4a3 3 0 00-3 3v1H2v5h20V6h-5zm-7-1a1 1 0 011-1h2a1 1 0 011 1v1h-4V5zM2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6H2z"/></svg>Jobs</div>
    <div class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 4H8a7 7 0 000 14h1v3l5.16-3.43A7 7 0 0016 4z"/></svg>Messaging</div>
    <div class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19h-8.28a2 2 0 11-3.44 0H2v-1a4.52 4.52 0 011.17-2.83l.83-.95V8a8 8 0 1116 0v6.22l.83 1A4.46 4.46 0 0122 18z"/></svg>Notifications</div>
    <div class="nav-icon"><span class="avatar-sm" id="nav-avatar">Y</span>Me ▾</div>
  </div>
</header>

<main>
  <!-- Left rail -->
  <div class="rail">
    <div class="card">
      <div class="id-cover"></div>
      <div class="id-body">
        <span class="avatar-lg" id="id-avatar">Y</span>
        <select id="user-select"></select>
        <p class="tagline" id="tagline"></p>
        <p class="degree" id="degree"></p>
      </div>
    </div>
    <div class="card roles-card">
      <h3>Explore roles</h3>
      <div id="role-list"></div>
    </div>
  </div>

  <!-- Main column -->
  <div>
    <div id="panel"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
// ---- Embedded data (mirror of backend/data/{users,roleSkills}.json) ----
const USERS = [
  { id: "user_5329", name: "Alex Rivera", degree: "Economics", skills: ["Corporate Finance","Economics","Ethical Hacking","Financial Modeling","Information Security","Investing","Network Security"], hero: true, tagline: "Econ grad with a hidden security streak" },
  { id: "user_5377", name: "Sam Carter", degree: "Software Engineering", skills: ["AWS","Blockchain","Computer","DevOps","Engineering","Science","Software"], tagline: "Builder, all-in on infrastructure" },
  { id: "user_8705", name: "Jordan Lee", degree: "Information Technology", skills: ["AWS","Blockchain","Computer","Corporate Finance","DevOps","Financial Modeling","Information","Investing","Science","Technology"], tagline: "Half techie, half finance" },
  { id: "user_4579", name: "Maya Brooks", degree: "Psychology", skills: ["Education","Psychology"], tagline: "People-first, exploring her options" },
  { id: "user_9138", name: "Chris Diaz", degree: "Accounting", skills: ["Accounting","Corporate Finance","Ethical Hacking","Financial Modeling","Information Security","Investing","Network Security"], tagline: "Numbers person curious about more" }
];

const ROLES_MAP = {
  software_engineer: { id: "software_engineer", name: "Software Engineer", category: "Technology", description: "Designs, builds, and maintains software systems and applications, turning requirements into reliable, scalable code.", skills: ["Python","AWS","DevOps","Software","Engineering","Data Analysis"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  devops_engineer: { id: "devops_engineer", name: "DevOps Engineer", category: "Technology", description: "Automates infrastructure, builds CI/CD pipelines, and keeps systems deployable, observable, and secure.", skills: ["AWS","DevOps","Blockchain","Network Security","Python","Information Security"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  data_scientist: { id: "data_scientist", name: "Data Scientist", category: "Technology", description: "Finds patterns in data and builds models that turn raw numbers into predictions and decisions.", skills: ["Python","Machine Learning","Data Analysis","AWS","Economics","Investing"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  ux_designer: { id: "ux_designer", name: "UX Designer", category: "Design", description: "Shapes how products feel to use — research, wireframes, and visual design that make experiences intuitive.", skills: ["UX/UI","Graphic Design","Photoshop","Communication","Content Creation","Creative Writing"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  product_manager: { id: "product_manager", name: "Product Manager", category: "Business", description: "Owns the what and why of a product — sets priorities, aligns teams, and ships things people want.", skills: ["Agile","Scrum","Project Planning","Strategic Planning","Communication","Data Analysis"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  financial_analyst: { id: "financial_analyst", name: "Financial Analyst", category: "Finance", description: "Models the numbers behind decisions — forecasts, valuations, and the story the data tells about money.", skills: ["Financial Modeling","Corporate Finance","Investing","Economics","Excel","Accounting"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  marketing_specialist: { id: "marketing_specialist", name: "Marketing Specialist", category: "Business", description: "Gets the right message to the right people — campaigns, content, and channels that drive growth.", skills: ["Marketing Strategies","SEO","Content Creation","Communication","Strategic Planning","Marketing"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  hr_coordinator: { id: "hr_coordinator", name: "HR Coordinator", category: "Business", description: "Keeps the people side of a company running — hiring, onboarding, and the policies that hold teams together.", skills: ["Recruiting","HR Policies","Employee Relations","Communication","Negotiation","Administration"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  sales_representative: { id: "sales_representative", name: "Sales Representative", category: "Business", description: "Turns prospects into customers — builds relationships, understands needs, and closes deals.", skills: ["Negotiation","Communication","Public Speaking","Strategic Planning","Business","Marketing"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] },
  customer_service_manager: { id: "customer_service_manager", name: "Customer Service Manager", category: "Business", description: "Leads the team that keeps customers happy — resolves issues, sets standards, and turns support into loyalty.", skills: ["Communication","Employee Relations","Negotiation","Project Planning","Administration","Business"], companies: ["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."] }
};
const ROLES = Object.values(ROLES_MAP);

// ---- Fit math (mirror of backend/fit.py + frontend/lib/fit.ts) ----
function computeFit(userSkills, role) {
  const userSet = new Set(userSkills.map((s) => s.toLowerCase()));
  const have = role.skills.filter((s) => userSet.has(s.toLowerCase())).sort();
  const missing = role.skills.filter((s) => !userSet.has(s.toLowerCase())).sort();
  const percent = role.skills.length === 0 ? 0 : Math.round((100 * have.length) / role.skills.length);
  return { role: { id: role.id, name: role.name, description: role.description, companies: role.companies }, percent, haveSkills: have, missingSkills: missing };
}
function band(percent) {
  if (percent >= 70) return { color: "#057642", label: "Strong match" };
  if (percent >= 40) return { color: "#0a66c2", label: "On your way" };
  return { color: "#915907", label: "Just getting started" };
}

let currentUserId = (USERS.find((u) => u.hero) || USERS[0]).id;
let currentRoleId = ROLES[0].id;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderUserPicker() {
  const sel = document.getElementById("user-select");
  sel.innerHTML = USERS.map((u) => `<option value="${u.id}" ${u.id === currentUserId ? "selected" : ""}>${esc(u.name)} ${u.hero ? "⭐" : ""}</option>`).join("");
  const u = USERS.find((x) => x.id === currentUserId);
  document.getElementById("tagline").textContent = u && u.tagline ? `“${u.tagline}”` : "";
  document.getElementById("degree").textContent = u && u.degree ? u.degree : "";
  const initial = (u ? u.name : "Y").charAt(0);
  document.getElementById("id-avatar").textContent = initial;
  document.getElementById("nav-avatar").textContent = initial;
}
function renderRoleList() {
  document.getElementById("role-list").innerHTML = ROLES.map((r) => `<button class="role-btn ${r.id === currentRoleId ? "active" : ""}" data-role="${r.id}">${esc(r.name)}</button>`).join("");
}
function ringSVG(percent) {
  const size = 160, stroke = 12, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const { color, label } = band(percent);
  return `
    <div style="width:${size}px;text-align:center;">
      <svg width="${size}" height="${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e7e4df" stroke-width="${stroke}"></circle>
        <circle id="ring-arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 ${size/2} ${size/2})"></circle>
        <text x="50%" y="46%" text-anchor="middle" dominant-baseline="middle" style="font-size:${size*0.26}px;font-weight:700;fill:rgba(0,0,0,0.9);">${percent}%</text>
        <text x="50%" y="62%" text-anchor="middle" dominant-baseline="middle" style="font-size:${size*0.08}px;fill:rgba(0,0,0,0.6);letter-spacing:0.5px;">JOB FIT</text>
      </svg>
      <div class="ring-label" style="color:${color};">${label}</div>
    </div>`;
}
function jobRow(company, i, fit) {
  // Synthesized but plausible LinkedIn job-card cues (deterministic by index).
  const posted = ["2 weeks ago", "3 days ago", "1 month ago", "5 days ago", "2 months ago"][i % 5];
  const alumni = [11, 3, 7, 1, 5][i % 5];
  const easyApply = i % 2 === 0;
  const chip = fit.percent >= 70 ? `<div class="strong-applicant">Strong applicant</div>` : "";
  const easy = easyApply ? ` · <span class="job-easy">⚡ Easy Apply</span>` : "";
  return `
    <div class="job-row">
      <div class="job-logo">${esc(company.charAt(0))}</div>
      <div style="min-width:0;">
        <div class="job-role">${esc(fit.role.name)}</div>
        <div class="job-company">${esc(company)}</div>
        ${chip}
        <div class="job-meta">${alumni} school alumni work here · Posted ${posted}${easy}</div>
      </div>
    </div>`;
}
function skillColumns(have, missing) {
  const chip = (s, kind) => `<li class="skill-item ${kind === "have" ? "skill-have" : "skill-missing"}"><span class="mark">${kind === "have" ? "✓" : "+"}</span>${esc(s)}</li>`;
  const haveCol = have.length === 0 ? `<p class="empty-have">None yet — every one of these is a fresh start.</p>` : `<ul class="skill-list">${have.map((s) => chip(s, "have")).join("")}</ul>`;
  const missingCol = missing.length === 0 ? `<p class="empty-missing">You have everything this role needs. 🎉</p>` : `<ul class="skill-list">${missing.map((s) => chip(s, "missing")).join("")}</ul>`;
  return `
    <div class="skill-cols">
      <div><h4>Skills you have <span class="count">(${have.length})</span></h4>${haveCol}</div>
      <div><h4>Skills to build <span class="count">(${missing.length})</span></h4>${missingCol}</div>
    </div>`;
}
function renderPanel() {
  const user = USERS.find((u) => u.id === currentUserId);
  const role = ROLES_MAP[currentRoleId];
  const fit = computeFit(user.skills, role);
  document.getElementById("panel").innerHTML = `
    <div class="card panel">
      <div class="panel-cover"></div>
      <div class="panel-body">
        <div class="role-icon">💼</div>
        <h2>${esc(fit.role.name)}</h2>
        <p class="role-desc">${esc(fit.role.description)}</p>
        <hr class="div" />
        <div class="ring-row">
          ${ringSVG(fit.percent)}
          <div class="companies">
            <h4>${fit.percent >= 70 ? "Jobs where you’d be a top applicant" : "Companies hiring"}</h4>
            <div>${fit.role.companies.map((c, i) => jobRow(c, i, fit)).join("")}</div>
          </div>
        </div>
        <hr class="div" />
        ${skillColumns(fit.haveSkills, fit.missingSkills)}
        <button class="build-btn" id="build-btn">Build my path →</button>
      </div>
    </div>`;
  const arc = document.getElementById("ring-arc");
  if (arc) {
    const c = parseFloat(arc.getAttribute("stroke-dasharray"));
    requestAnimationFrame(() => { arc.setAttribute("stroke-dashoffset", c * (1 - fit.percent / 100)); });
  }
  document.getElementById("build-btn").addEventListener("click", () => {
    const payload = { roleId: fit.role.id, missingSkills: fit.missingSkills };
    console.log("Build my path →", payload);
    showToast("Build my path →\n" + JSON.stringify(payload, null, 2));
  });
}
let toastTimer;
function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}
document.getElementById("user-select").addEventListener("change", (e) => { currentUserId = e.target.value; renderUserPicker(); renderPanel(); });
document.getElementById("role-list").addEventListener("click", (e) => { const btn = e.target.closest(".role-btn"); if (!btn) return; currentRoleId = btn.dataset.role; renderRoleList(); renderPanel(); });
renderUserPicker(); renderRoleList(); renderPanel();
</script>
</body>
</html>
