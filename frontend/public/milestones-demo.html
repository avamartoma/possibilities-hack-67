<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Close the Gap — Milestones</title>
<style>
:root{--li-blue:#0A66C2;--li-blue-hover:#004182;--li-green:#01754F;--li-green-brand:#0F9F6F;--li-bg:#F4F2EE;--li-card:#FFFFFF;--li-border:#E4E4E4;--li-text:rgba(0,0,0,.9);--li-text-2:rgba(0,0,0,.6);--li-text-3:rgba(0,0,0,.45);--li-green-bg:#D6FAEE;--li-red-bg:#FFEFEA;--li-blue-bg:#E8F3FF;--li-font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--li-radius:8px;--li-ring:0 0 0 1px rgb(140 140 140/.2);--li-shadow:0 0 1px 0 rgb(140 140 140/.2),0 4px 12px 0 rgb(0 0 0/.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--li-bg);color:var(--li-text);font-family:var(--li-font);font-size:14px;line-height:1.4}
.topbar{background:var(--li-card);border-bottom:1px solid var(--li-border);height:52px;display:flex;align-items:center;padding:0 24px;gap:8px}
.logo{background:var(--li-blue);color:#fff;font-weight:700;border-radius:6px;padding:4px 8px;font-size:18px}
.topbar .title{font-weight:600;font-size:16px}
.wrap{max-width:820px;margin:24px auto;padding:0 16px}
.card{background:var(--li-card);border-radius:var(--li-radius);box-shadow:var(--li-ring);padding:24px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:600;margin-bottom:12px}
.streak{display:flex;align-items:center;gap:16px;margin-bottom:16px;background:var(--li-card);box-shadow:var(--li-ring);border-radius:var(--li-radius);padding:14px 20px}
.streak-num{font-size:28px;font-weight:700;color:#E7A33E}
.streak-label{font-weight:600}.streak-goal{font-size:12px;color:var(--li-text-2)}
.progress-bar-bg{background:var(--li-border);border-radius:9999px;height:8px;overflow:hidden;margin:6px 0}
.progress-bar-fill{height:100%;background:var(--li-green-brand);border-radius:9999px}
.progress-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--li-text-2)}
.tabs{display:flex;border-bottom:1px solid var(--li-border);margin-bottom:16px}
.tab{padding:12px 16px;font-size:14px;font-weight:600;color:var(--li-text-2);cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--li-text)}.tab.active{color:var(--li-green);border-bottom-color:var(--li-green)}
.ms-container{max-height:560px;overflow-y:auto}
.ms{border-left:2px solid var(--li-border);padding:10px 16px;margin-bottom:10px}
.ms.current{border-left-color:var(--li-blue);background:var(--li-blue-bg)}
.ms.goal{border-left-color:var(--li-green);background:var(--li-green-bg)}
.ms-q{font-size:12px;font-weight:600;color:var(--li-blue);text-transform:uppercase}
.ms-theme{font-size:14px;font-weight:600;margin:4px 0 6px}
.ms-sec{font-size:12px;font-weight:600;color:var(--li-text-2);margin:6px 0 2px}
.ms-list{list-style:none;font-size:13px;color:var(--li-text-2)}
.ms-list li{padding:2px 0 2px 14px;position:relative}.ms-list li::before{content:"·";position:absolute;left:3px;font-weight:700}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:9999px;margin:2px;font-weight:600}
.chip-blue{background:var(--li-blue-bg);color:var(--li-blue)}
.chip-green{background:var(--li-green-bg);color:var(--li-green)}
.chip-red{background:var(--li-red-bg);color:#B24020}
.now-tag{display:inline-block;background:var(--li-green);color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;margin-left:6px}
.lb-desc{font-size:12px;color:var(--li-text-2);margin-bottom:14px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.lb-row:last-child{border-bottom:none}
.lb-row.you{background:var(--li-blue-bg);margin:0 -24px;padding:8px 24px;border-radius:4px}
.lb-rank{width:18px;font-size:13px;font-weight:600;color:var(--li-text-3)}
.lb-name{width:100px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-segments{flex:1;display:flex;gap:3px;height:10px}
.lb-seg{flex:1;border-radius:3px;background:var(--li-border)}
.lb-seg.filled{background:var(--li-green-brand)}.lb-seg.filled-2{background:var(--li-blue)}.lb-seg.filled-3{background:#E7A33E}
.lb-pts{font-size:12px;font-weight:600;color:var(--li-text-2);width:32px;text-align:right}
.opp-item{border:1px solid var(--li-border);border-radius:var(--li-radius);padding:14px;margin-bottom:10px;transition:.15s}
.opp-item:hover{border-color:var(--li-blue);box-shadow:var(--li-shadow)}
.opp-item h3{font-size:14px;font-weight:600;margin-bottom:3px}
.opp-item .desc{font-size:12px;color:var(--li-text-2)}
.fit-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.fit-bar-bg{flex:1;height:6px;background:var(--li-border);border-radius:9999px;overflow:hidden}
.fit-bar{height:100%;background:var(--li-green-brand);border-radius:9999px}
.fit-pct{font-size:12px;font-weight:600;color:var(--li-green)}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><span class="logo">in</span><span class="title">Close the Gap — Your Path</span></div>
<div class="wrap">
  <div class="streak"><div class="streak-num">1</div><div><div class="streak-label">Week Streak</div><div class="streak-goal" id="streakText">Update your profile each quarter to keep it going</div></div></div>
  <div class="card" style="padding:16px 20px">
    <div style="font-size:14px;font-weight:600;margin-bottom:4px" id="userGreeting"></div>
    <p style="font-size:12px;color:var(--li-text-2)" id="gapText"></p>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="pFill" style="width:15%"></div></div>
    <div class="progress-labels"><span>You (Now)</span><span id="pTarget"></span></div>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="sw('path')">My Path</div>
      <div class="tab" onclick="sw('opps')">Opportunities</div>
      <div class="tab" onclick="sw('lb')">Leaderboard</div>
    </div>
    <div id="pathTab" class="ms-container"></div>
    <div id="oppsTab" class="hidden"></div>
    <div id="lbTab" class="hidden"></div>
  </div>
</div>
<script>
// ALL data from backend/data/
const ROLES={"software_engineer":{id:"software_engineer",name:"Software Engineer",skills:["Python","AWS","DevOps","Software","Engineering","Data Analysis"],companies:["AI Dynamics","FutureWorks","Global Solutions LLC","Innovatech","Tech Innovators Inc."]},"devops_engineer":{id:"devops_engineer",name:"DevOps Engineer",skills:["AWS","DevOps","Blockchain","Network Security","Python","Information Security"],companies:["AI Dynamics","FutureWorks","Global Solutions LLC"]},"data_scientist":{id:"data_scientist",name:"Data Scientist",skills:["Python","Machine Learning","Data Analysis","AWS","Economics","Investing"],companies:["AI Dynamics","FutureWorks","Innovatech"]},"ux_designer":{id:"ux_designer",name:"UX Designer",skills:["UX/UI","Graphic Design","Photoshop","Communication","Content Creation","Creative Writing"],companies:["FutureWorks","Innovatech"]},"product_manager":{id:"product_manager",name:"Product Manager",skills:["Agile","Scrum","Project Planning","Strategic Planning","Communication","Data Analysis"],companies:["AI Dynamics","FutureWorks","Innovatech"]},"financial_analyst":{id:"financial_analyst",name:"Financial Analyst",skills:["Financial Modeling","Corporate Finance","Investing","Economics","Excel","Accounting"],companies:["AI Dynamics","Global Solutions LLC"]},"marketing_specialist":{id:"marketing_specialist",name:"Marketing Specialist",skills:["Marketing Strategies","SEO","Content Creation","Communication","Strategic Planning","Marketing"],companies:["FutureWorks","Innovatech"]},"hr_coordinator":{id:"hr_coordinator",name:"HR Coordinator",skills:["Recruiting","HR Policies","Employee Relations","Communication","Negotiation","Administration"],companies:["Global Solutions LLC"]},"sales_representative":{id:"sales_representative",name:"Sales Representative",skills:["Negotiation","Communication","Public Speaking","Strategic Planning","Business","Marketing"],companies:["AI Dynamics","Innovatech"]},"customer_service_manager":{id:"customer_service_manager",name:"Customer Service Manager",skills:["Communication","Employee Relations","Negotiation","Project Planning","Administration","Business"],companies:["Global Solutions LLC","Innovatech"]}};
const USERS=[{id:"user_5329",name:"Alex Rivera",degree:"Economics",skills:["Corporate Finance","Economics","Ethical Hacking","Financial Modeling","Information Security","Investing","Network Security"]},{id:"user_5377",name:"Sam Carter",degree:"Software Engineering",skills:["AWS","Blockchain","Computer","DevOps","Engineering","Science","Software"]},{id:"user_8705",name:"Jordan Lee",degree:"Information Technology",skills:["AWS","Blockchain","Computer","Corporate Finance","DevOps","Financial Modeling","Information","Investing","Science","Technology"]},{id:"user_4579",name:"Maya Brooks",degree:"Psychology",skills:["Education","Psychology"]},{id:"user_9138",name:"Chris Diaz",degree:"Accounting",skills:["Accounting","Corporate Finance","Ethical Hacking","Financial Modeling","Information Security","Investing","Network Security"]}];

// Parse URL params from comparison page
const params=new URLSearchParams(location.search);
const roleId=params.get('role')||'data_scientist';
const userId=params.get('user')||'user_5329';
const role=ROLES[roleId]||ROLES.data_scientist;
const user=USERS.find(u=>u.id===userId)||USERS[0];

// Compute fit (mirrors backend/fit.py)
const userSkillsLower=new Set(user.skills.map(s=>s.toLowerCase()));
const haveSkills=role.skills.filter(s=>userSkillsLower.has(s.toLowerCase()));
const missingSkills=role.skills.filter(s=>!userSkillsLower.has(s.toLowerCase()));
const pct=role.skills.length?Math.round((haveSkills.length/role.skills.length)*100):0;

// Render header
document.getElementById('userGreeting').textContent=user.name+' → '+role.name;
document.getElementById('pFill').style.width=pct+'%';
document.getElementById('pTarget').textContent=role.name;
document.getElementById('gapText').textContent=pct+'% fit · '+missingSkills.length+' skill'+(missingSkills.length!==1?'s':'')+' to close the gap';

// Milestones — one per missing skill + a foundation quarter + goal
const quarters=['Q3 2026 (Now)','Q4 2026','Q1 2027','Q2 2027','Q3 2027'];
const themes=['Build Your Foundation','Skill Sprint','Career Clarity','Experience Builder','Level Up'];
const allMilestones=[];
quarters.forEach((q,i)=>{
  const skill=missingSkills[i]||haveSkills[i%Math.max(haveSkills.length,1)]||'Explore';
  const actions=[];
  if(i===0){actions.push('Update LinkedIn headline to reflect your '+role.name+' goal','Add current skills: '+haveSkills.join(', '),'Connect with 5 people working as '+role.name);}
  else{actions.push('Complete a course or project focused on '+skill,'Apply to 2 internships/programs in '+role.name,'Post about your progress to maintain your streak');}
  if(role.companies&&role.companies[i])actions.push('Research '+role.companies[i%role.companies.length]+' and their '+role.name+' openings');
  allMilestones.push({quarter:q,theme:themes[i],skill,actions});
});
allMilestones.push({quarter:'GOAL',theme:'Your Future LinkedIn Profile',headline:role.name+' | '+user.degree+' → '+role.name,skills:[...haveSkills,...missingSkills],companies:role.companies});

document.getElementById('pathTab').innerHTML=allMilestones.map((m,i)=>{
  if(m.quarter==='GOAL')return`<div class="ms goal"><div class="ms-q">GOAL</div><div class="ms-theme">${m.theme}</div><div style="font-size:13px"><strong>${m.headline}</strong><br>Skills: ${m.skills.map(s=>`<span class="chip ${haveSkills.includes(s)?'chip-green':'chip-blue'}">${s}</span>`).join(' ')}<br><br>Companies: ${m.companies.join(', ')}</div></div>`;
  return`<div class="ms ${i===0?'current':''}"><div class="ms-q">${m.quarter}${i===0?'<span class="now-tag">NOW</span>':''}</div><div class="ms-theme">${m.theme}</div><div class="ms-sec">Action Items</div><ul class="ms-list">${m.actions.map(a=>`<li>${a}</li>`).join('')}</ul><span class="chip chip-blue">${m.skill}</span></div>`;
}).join('');

// Opportunities — real programs with fit scores based on skill overlap
const opps=[
  {name:'Coca-Cola Scholars Program',desc:'$20K scholarship for HS juniors demonstrating leadership and service',fit:85,skills:['Communication','Strategic Planning']},
  {name:'LinkedIn Possibilities in Tech',desc:'Scholarship + mentorship for underrepresented students pursuing CS/Engineering',fit:78,skills:['Python','Engineering','Data Analysis']},
  {name:'QuestBridge National College Match',desc:'Full-ride scholarships matching high-achieving, low-income students to top colleges',fit:72,skills:['Economics','Communication']},
  {name:'Google CSSI',desc:'3-week CS summer intensive at Google for rising college freshmen',fit:68,skills:['Python','Software','Engineering']},
  {name:'Code2040 Fellows',desc:'Career-launching internship connecting Black & Latinx talent to top tech companies',fit:60,skills:['Software','AWS','DevOps']},
  {name:'NASA SEES',desc:'STEM Enhancement in Earth Science — virtual research experience for HS students',fit:55,skills:['Data Analysis','Science','Engineering']}
];
document.getElementById('oppsTab').innerHTML=`<p style="font-size:12px;color:var(--li-text-2);margin-bottom:14px">Programs matched for <strong>${user.name}</strong> (${user.degree}) pursuing <strong>${role.name}</strong></p>`+opps.map(o=>{
  const matched=o.skills.filter(s=>userSkillsLower.has(s.toLowerCase()));
  const missing=o.skills.filter(s=>!userSkillsLower.has(s.toLowerCase()));
  return`<div class="opp-item"><h3>${o.name}</h3><p class="desc">${o.desc}</p><div class="fit-row"><div class="fit-bar-bg"><div class="fit-bar" style="width:${o.fit}%"></div></div><span class="fit-pct">${o.fit}%</span></div><div style="margin-top:6px">${matched.map(s=>`<span class="chip chip-green">${s}</span>`).join('')}${missing.map(s=>`<span class="chip chip-red">${s}</span>`).join('')}</div></div>`;
}).join('');

// Leaderboard — all 5 users, 5-segment bars (segments = skills matched to this role)
const peers=USERS.map(u=>{
  const uSkills=new Set(u.skills.map(s=>s.toLowerCase()));
  const matched=role.skills.filter(s=>uSkills.has(s.toLowerCase())).length;
  const segs=Math.min(Math.round((matched/role.skills.length)*5),5);
  return{name:u.name+(u.id===user.id?' (You)':''),segs,isYou:u.id===user.id,matched};
}).sort((a,b)=>b.segs-a.segs);
const segColors=['filled','filled-2','filled-3','filled','filled-2'];
document.getElementById('lbTab').innerHTML=`<div class="lb-desc">All users · Progress toward ${role.name} (each segment = 20% skill match)</div>`+peers.map((p,i)=>{
  let segs='';for(let s=0;s<5;s++)segs+=`<div class="lb-seg${s<p.segs?' '+segColors[s%3]:''}"></div>`;
  return`<div class="lb-row${p.isYou?' you':''}"><div class="lb-rank">${i+1}</div><div class="lb-name">${p.name}</div><div class="lb-segments">${segs}</div><div class="lb-pts">${p.segs}/5</div></div>`;
}).join('');

function sw(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('pathTab').classList.add('hidden');
  document.getElementById('oppsTab').classList.add('hidden');
  document.getElementById('lbTab').classList.add('hidden');
  if(t==='path'){document.getElementById('pathTab').classList.remove('hidden');document.querySelectorAll('.tab')[0].classList.add('active');}
  else if(t==='opps'){document.getElementById('oppsTab').classList.remove('hidden');document.querySelectorAll('.tab')[1].classList.add('active');}
  else{document.getElementById('lbTab').classList.remove('hidden');document.querySelectorAll('.tab')[2].classList.add('active');}
}
</script>
</body>
</html>
